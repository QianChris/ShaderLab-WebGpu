name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm run check:plugins
      - run: npm test
      - run: node scripts/validate-config.mjs
      - run: node scripts/smoke-plugin-loader.mjs
