name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm 11, matching the npm that generates the
          # lockfile. npm 10's `npm ci` rejects optional peer deps (rolldown
          # -vite's esbuild) missing from the lockfile — keep these in sync.
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm run check:plugins
      - run: npm test
      - run: node scripts/validate-config.mjs
      - run: node scripts/smoke-plugin-loader.mjs
