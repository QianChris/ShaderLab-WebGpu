# Deploys the demo site to GitHub Pages via a root-path repo (<user>.github.io).
#
# One-time setup:
#   1. Create an empty public repo named `QianChris.github.io` (or change
#      TARGET_REPO below if you use a different name / custom domain setup).
#   2. Create a fine-grained Personal Access Token (GitHub Settings ->
#      Developer settings) with Contents: Read and write on THAT repo only.
#   3. Add it as the repository secret `PAGES_DEPLOY_TOKEN` in THIS repo.
#   4. Add the site password as the repository secret `SITE_PASSWORD`.
#   5. GitHub Pages serves <user>.github.io from the default branch root
#      automatically — no further Pages config needed.
#
# Note: the password gate is client-side only (a deterrent, not real auth —
# demo assets remain publicly fetchable by URL). For real access control put
# Cloudflare Access in front of the site.

name: Deploy Site

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: QianChris/QianChris.github.io # <- edit if different
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Must match the npm version that generates the lockfile (see ci.yml).
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-site.mjs --password "$SITE_PASSWORD"
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      - name: Push dist/ to Pages repo
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [ -z "$PAGES_DEPLOY_TOKEN" ]; then
            echo "::error::Missing secret PAGES_DEPLOY_TOKEN (see comments at top of this workflow)"
            exit 1
          fi
          cd dist
          git init -b main
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add -A
          git commit -m "deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${PAGES_DEPLOY_TOKEN}@github.com/${TARGET_REPO}.git" main
